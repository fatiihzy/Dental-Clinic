version: "3.1"

intents:
  - greet
  - goodbye
  - mood_great
  - mood_unhappy
  - ask_gpt
  - tanya_jadwal_dokter
  - tentang_bot
  - tanya_lokasi
  - tanya_jam_operasional
  - tanya_kontak
  - thank_you

responses:
  utter_greet:
    - text: "Hai! Ada yang bisa saya bantu hari ini?"

  utter_goodbye:
    - text: "Sampai jumpa!"

  utter_tentang_bot:
    - text: |
        Halo! Aku adalah chatbot dari Gigita Dental Care 🦷. Aku di sini untuk membantumu seputar layanan klinik kami, perawatan gigi, jadwal dokter, dan info penting lainnya. Silakan tanya apa saja ya! 😊

  utter_lokasi:
    - text: Klinik kami berlokasi di Jl. Perintis Kemerdekaan III No.4 Makassar, Sulawesi Selatan 📍

  utter_jam_operasional:
    - text: Klinik kami buka setiap hari Senin sampai Sabtu, pukul 17.00 - 21.00 🕗

  utter_kontak:
    - text: Kamu bisa hubungi kami di nomor +62 8517 9966117 📞


  utter_cheer_up:
    - text: "Aku ngerti kok, kadang hari-hari bisa berat. Tapi kamu hebat karena udah bertahan sejauh ini 😊 Jangan ragu untuk cerita atau tanya seputar kesehatan gigi juga ya."
    - text: "Hei, nggak apa-apa loh ngerasa sedih. Tapi inget, kamu kuat dan pasti bisa lewatin ini 💪 Kalau butuh info seputar gigi, aku siap bantu juga."
    - text: "Hari ini mungkin terasa berat, tapi besok bisa jadi lebih baik 🌈 Semangat ya! Aku di sini kalau kamu butuh ngobrol seputar klinik atau perawatan gigi."
    - text: "Jangan lupa, bahkan senyum paling cerah pun pernah redup 🌤️ Kalau mau cerita, aku siap denger... atau bantu booking janji kalau kamu butuh."
    - text: "Kadang perasaan sedih itu datang diam-diam. Tapi kamu gak sendirian 😊 Mau ngobrol? Aku bisa bantu seputar layanan klinik dan tips jaga gigi juga!"

  utter_thank_you:
    - text: "Sama-sama! Senang bisa membantu. Kalau ada yang lain, jangan ragu untuk tanya ya! 😊"
    - text: "Terima kasih kembali! Aku di sini untuk membantu kapan saja. Ada yang ingin kamu tanyakan lagi? 😊"
    - text: "Sama-sama! Senang bisa membantu. 😊"
    - text: "Sama-sama! 😊"
    - text: "Terima kasih kembali! 😊"

  utter_happy:
    - text: "Senang mendengarnya! 😊"






actions:
  - action_gpt_answer
  - action_cek_jadwal_dokter


session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true