version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Jawab terima kasih
  steps:
    - intent: thank_you
    - action: utter_thank_you

- rule: Jawaban saat ditanya siapa chatbotnya
  steps:
  - intent: tentang_bot
  - action: utter_tentang_bot

- rule: Jawaban untuk lokasi klinik
  steps:
  - intent: tanya_lokasi
  - action: utter_lokasi

- rule: Jawaban untuk jam operasional
  steps:
  - intent: tanya_jam_operasional
  - action: utter_jam_operasional

- rule: Jawaban untuk kontak
  steps:
  - intent: tanya_kontak
  - action: utter_kontak

- rule: Jawab salam
  steps:
    - intent: greet
    - action: utter_greet

- rule: Jawab pertanyaan pakai GPT
  steps:
    - intent: ask_gpt
    - action: action_gpt_answer

- rule: Jawab jadwal dokter
  steps:
    - intent: tanya_jadwal_dokter
    - action: action_cek_jadwal_dokter
